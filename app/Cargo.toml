[package]
name = "ddlin"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ddlin-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.24"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
