<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ddlin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="dicts"></div>
  <button id="font">Font…</button>
  <button id="folder" title="Choose dictionary folder">Folder…</button>
</header>
<main>
  <section id="side">
    <div id="modes">
      <button data-mode="Prefix">Prefix</button>
      <button data-mode="Suffix">Suffix</button>
      <button data-mode="Exact">Exact</button>
    </div>
    <form id="form"><input id="query" autocomplete="off" spellcheck="false"><button>Search</button></form>
    <div id="count"></div>
    <ul id="hits"></ul>
  </section>
  <div id="splitter"></div>
  <section id="text"></section>
</main>
<footer id="status"></footer>
<dialog id="fonts">
  <form method="dialog">
    <h3>Fonts</h3>
    <div class="grid">
      <label for="uiFamily">UI</label>
      <select id="uiFamily"></select>
      <input id="uiSize" type="number" min="6" max="72">
      <label for="listFamily">Headword list</label>
      <select id="listFamily"></select>
      <input id="listSize" type="number" min="6" max="72">
      <label for="textFamily">Text</label>
      <select id="textFamily"></select>
      <input id="textSize" type="number" min="6" max="72">
      <label></label>
      <label><input id="antialias" type="checkbox"> Antialiasing</label>
    </div>
    <div class="buttons">
      <button type="button" id="fontsCancel">Cancel</button>
      <button value="ok">OK</button>
    </div>
  </form>
</dialog>
<script src="main.js"></script>
</body>
</html>
